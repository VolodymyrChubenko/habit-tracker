<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Статистика</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#7CB9A8}a:hover{color:#5e9c8b}
</style>
</helmet>
<div style="width: 390px; height: {{rootH}}; box-sizing: border-box; background: {{t.bg}}; font-family: Montserrat, -apple-system, sans-serif; color: {{t.text}}; position: relative; overflow: hidden; padding: 16px 16px 24px">
<header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px">
<h1 style="margin: 0; font-size: 24px; font-weight: 600; color: {{t.text}}">{{heading}}</h1>
<sc-if value="{{isStats}}" hint-placeholder-val="{{true}}">
<a href="{{l.archive}}" style="font-size: 14px; font-weight: 600; color: {{t.accent}}; text-decoration: none; padding: 4px 10px; border-radius: 14px; background: {{t.accentBg}}">Архів</a>
</sc-if>
<sc-if value="{{isArchive}}" hint-placeholder-val="{{false}}">
<a href="{{l.stats}}" aria-label="Закрити архів" style="font-size: 20px; line-height: 1; color: {{t.danger}}; padding: 4px 8px; text-decoration: none">✕</a>
</sc-if>
</header>
<div role="group" aria-label="Фільтр челенджів" style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px">
<button type="button" aria-pressed="{{allPressed}}" style="border-radius: 20px; padding: 5px 13px; font-family: inherit; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 5px; cursor: pointer; border: 1.5px solid {{allBorder}}; background: {{allBg}}; color: {{allColor}}">Всі</button>
<sc-for list="{{chips}}" as="c" hint-placeholder-count="10">
<button type="button" aria-pressed="{{c.pressed}}" style="border-radius: 20px; padding: 5px 13px; font-family: inherit; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 5px; cursor: pointer; border: 1.5px solid {{c.border}}; background: {{c.bg}}; color: {{c.text}}"><span style="width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: {{c.color}}"></span>{{c.name}}</button>
</sc-for>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px">
<button type="button" aria-label="Попередній місяць" style="font-size: 18px; color: {{t.text2}}; padding: 4px 10px; cursor: pointer; background: none; border: 0; font-family: inherit">‹</button>
<span style="font-size: 15px; font-weight: 600; color: {{t.text}}">листопад 2026</span>
<button type="button" aria-label="Наступний місяць" style="font-size: 18px; color: {{t.text2}}; padding: 4px 10px; cursor: pointer; background: none; border: 0; font-family: inherit">›</button>
</div>
<section aria-label="Календар" style="background: {{t.surface}}; border-radius: 16px; padding: 12px; box-shadow: {{t.shadowCard}}">
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); margin-bottom: 6px">
<span style="text-align: center; font-size: 11px; font-weight: 600; color: {{t.text2}}; padding: 2px 0">Пн</span><span style="text-align: center; font-size: 11px; font-weight: 600; color: {{t.text2}}; padding: 2px 0">Вт</span><span style="text-align: center; font-size: 11px; font-weight: 600; color: {{t.text2}}; padding: 2px 0">Ср</span><span style="text-align: center; font-size: 11px; font-weight: 600; color: {{t.text2}}; padding: 2px 0">Чт</span><span style="text-align: center; font-size: 11px; font-weight: 600; color: {{t.text2}}; padding: 2px 0">Пт</span><span style="text-align: center; font-size: 11px; font-weight: 600; color: {{t.text2}}; padding: 2px 0">Сб</span><span style="text-align: center; font-size: 11px; font-weight: 600; color: {{t.text2}}; padding: 2px 0">Нд</span>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px">
<sc-for list="{{days}}" as="d" hint-placeholder-count="36">
<a href="{{d.href}}" tabindex="{{d.tab}}" aria-label="{{d.aria}}" style="aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: {{d.cellBg}}; visibility: {{d.vis}}; cursor: {{d.cursor}}; text-decoration: none">
<svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="13" fill="none" stroke="{{d.track}}" stroke-width="2.5"></circle><circle cx="17" cy="17" r="13" fill="none" stroke="{{t.accent}}" stroke-width="2.5" stroke-dasharray="{{d.dash}}" stroke-linecap="round" transform="rotate(-90 17 17)" opacity="{{d.arcOpacity}}"></circle><text x="17" y="17" dominant-baseline="middle" text-anchor="middle" font-size="10" font-weight="{{d.weight}}" fill="{{d.textColor}}" font-family="Montserrat, sans-serif">{{d.label}}</text></svg>
</a>
</sc-for>
</div>
</section>
<sc-if value="{{hasStatus}}" hint-placeholder-val="{{true}}">
<section style="margin-top: 18px">
<p style="margin: 0 0 10px; font-size: 11px; font-weight: 600; color: {{t.text2}}; text-transform: uppercase; letter-spacing: 0.5px">Статус</p>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{status}}" as="s" hint-placeholder-count="4">
<div style="background: {{t.surface}}; border-radius: 12px; box-shadow: {{t.shadowCard}}; border-left: 3px solid {{s.color}}; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="font-size: 13px; font-weight: 500; color: {{t.text}}; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{s.name}}</span>
<span style="font-size: 26px; font-weight: 600; line-height: 1.1; color: {{s.color}}">{{s.streak}}</span>
<span style="font-size: 12px; color: {{t.text2}}">{{s.unit}} поспіль</span>
</div>
</sc-for>
</div>
</section>
</sc-if>
<sc-if value="{{hasArchived}}" hint-placeholder-val="{{false}}">
<section style="margin: 20px 0">
<p style="margin: 0 0 10px; font-size: 11px; font-weight: 600; color: {{t.text2}}; text-transform: uppercase; letter-spacing: 0.5px">Заархівовані челенджі</p>
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{archived}}" as="a" hint-placeholder-count="1">
<div style="background: {{t.surface}}; border-radius: 12px; box-shadow: {{t.shadowCard}}; padding: 12px 14px; display: flex; align-items: center; gap: 10px">
<span style="width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; background: {{a.color}}"></span>
<div style="flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0">
<span style="font-size: 14px; font-weight: 500; color: {{t.text}}; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{a.name}}</span>
<span style="font-size: 11px; color: {{t.muted}}">Архівовано {{a.date}}</span>
</div>
<button type="button" style="font-family: inherit; font-size: 13px; font-weight: 600; color: {{t.accent}}; background: {{t.accentBg}}; border: 0; border-radius: 14px; padding: 6px 12px; cursor: pointer; flex-shrink: 0">Відновити</button>
<button type="button" style="font-family: inherit; font-size: 13px; font-weight: 600; color: {{deleteColor}}; background: {{deleteBg}}; border: {{deleteBorder}}; border-radius: 14px; padding: {{deletePad}}; cursor: pointer; flex-shrink: 0">{{deleteLabel}}</button>
</div>
</sc-for>
</div>
</section>
</sc-if>
<nav aria-label="Навігація" style="position: absolute; left: 12px; right: 12px; bottom: 12px; background: {{t.surface}}; border-radius: 18px; padding: 6px; display: flex; justify-content: space-between; box-shadow: {{t.shadowNav}}">
<sc-for list="{{tabsLeft}}" as="tab" hint-placeholder-count="2">
<a href="{{tab.href}}" aria-current="{{tab.current}}" style="flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 4px; border-radius: 12px; text-decoration: none; background: {{tab.bg}}; color: {{tab.color}}">
<sc-if value="{{tab.isToday}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="3" rx="1.5"></rect><rect x="3" y="11" width="18" height="3" rx="1.5"></rect><rect x="3" y="17" width="18" height="3" rx="1.5"></rect></svg></sc-if>
<sc-if value="{{tab.isStats}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="14" width="4" height="7" rx="1"></rect><rect x="10" y="9" width="4" height="12" rx="1"></rect><rect x="17" y="4" width="4" height="17" rx="1"></rect></svg></sc-if>
<span style="font-size: 10px; font-weight: {{tab.weight}}">{{tab.label}}</span></a>
</sc-for>
<div aria-hidden="true" style="flex: 0 0 58px"></div>
<sc-for list="{{tabsRight}}" as="tab" hint-placeholder-count="2">
<a href="{{tab.href}}" aria-current="{{tab.current}}" style="flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 4px; border-radius: 12px; text-decoration: none; background: {{tab.bg}}; color: {{tab.color}}">
<sc-if value="{{tab.isAch}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg></sc-if>
<sc-if value="{{tab.isSettings}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></sc-if>
<span style="font-size: 10px; font-weight: {{tab.weight}}">{{tab.label}}</span></a>
</sc-for>
<a href="{{l.add}}" aria-label="Додати челендж" style="position: absolute; left: 50%; top: -20px; transform: translateX(-50%); width: 52px; height: 52px; box-sizing: border-box; border-radius: 50%; background: {{t.accent}}; color: {{t.onAccent}}; font-size: 28px; font-weight: 400; display: flex; align-items: center; justify-content: center; border: 4px solid {{t.bg}}; box-shadow: 0 5px 16px {{t.accentShadow}}; padding-bottom: 3px; text-decoration: none">+</a>
</nav>
</div>
</x-dc>

function tokens(props) {
  const p = PALETTES[props.palette] ?? PALETTES.default;
  return p[props.theme === 'dark' ? 'dark' : 'light'];
}
const C = { blue: '#5BA4CF', mint: '#7CB9A8', purple: '#9B89D4', red: '#F06B7E' };
const CHALLENGES = [
  { id: 'meditation', name: '🧘meditation', color: C.blue },
  { id: 'programing', name: '💻programing', color: C.blue },
  { id: 'research', name: '🔍research session', color: C.blue },
  { id: 'training', name: '💪training', color: C.mint },
  { id: 'running', name: '🏃training', color: C.mint },
  { id: 'vision', name: '👁️vision session', color: C.purple },
  { id: 'facial', name: '🤦🏻‍♂️facial care', color: C.purple },
  { id: 'gaming', name: '🚫🎮 gaming [detox]', color: C.red },
  { id: 'video', name: '🚫▶️video [detox]', color: C.red },
  { id: 'alcohol', name: '🚫🥃alcohol [detox]', color: C.red }
];
// useStreaks показує лише серії від 2 днів
const STATUS_ALL = [
  { name: '🧘meditation', color: C.blue, streak: 2 },
  { name: '💪training', color: C.mint, streak: 2 },
  { name: '🤦🏻‍♂️facial care', color: C.purple, streak: 64 },
  { name: '🚫🥃alcohol [detox]', color: C.red, streak: 83 }
];
const DAY_PROGRESS = [0.3, 0.5, 0.4, 0.6, 0.5, 0.45, 0.4, 0.4, 0.5, 0.2, 0.4, 0.3];
const MEDITATION_DONE = [2, 4, 5, 6, 8, 9, 11, 12];
const CIRC = 2 * Math.PI * 13;
const TODAY = 12;
// Листопад 2026 починається з неділі: 6 порожніх клітинок (Пн=0)
const START_OFFSET = 6;
function dayWord(n) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return 'день';
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return 'дні';
  return 'днів';
}
function navTabs(active, t, l) {
  const all = [
    { key: 'today', label: 'Сьогодні', href: l.today, isToday: true },
    { key: 'stats', label: 'Статистика', href: l.stats, isStats: true },
    { key: 'ach', label: 'Досягнення', href: l.ach, isAch: true },
    { key: 'settings', label: 'Налаштування', href: l.settings, isSettings: true }
  ].map((tab) => {
    const on = tab.key === active;
    return { isToday: false, isStats: false, isAch: false, isSettings: false, ...tab, current: on ? 'page' : 'false', bg: on ? t.accentBg : 'transparent', color: on ? t.accent : t.muted, weight: on ? 600 : 500 };
  });
  return { tabsLeft: all.slice(0, 2), tabsRight: all.slice(2) };
}
function links(dark) {
  const s = dark ? 'Dark' : '';
  return { today: `Today${s}.dc.html`, stats: `Statistics${s}.dc.html`, ach: `Achievements${s}.dc.html`, settings: `Settings${s}.dc.html`, add: `NewChallenge${s}.dc.html`, archive: `Archive${s}.dc.html`, dayEdit: `DayEdit${s}.dc.html` };
}
function buildDays(t, progressOf, interactive, l) {
  const blank = { label: '', aria: '', href: '#', tab: '-1', cursor: 'default', vis: 'hidden', cellBg: 'transparent', track: 'transparent', dash: `0 ${CIRC}`, arcOpacity: 0, textColor: t.text, weight: 500 };
  const days = Array.from({ length: 30 }, (_, i) => {
    const n = i + 1;
    const isToday = n === TODAY;
    const future = n > TODAY;
    const p = future ? 0 : progressOf(n);
    const clickable = interactive && !future;
    return {
      label: n,
      aria: future ? `${n} листопада` : `${n} листопада: ${Math.round(p * 100)}%`,
      href: clickable ? l.dayEdit : '#',
      tab: clickable ? '0' : '-1',
      cursor: clickable ? 'pointer' : 'default',
      vis: 'visible',
      cellBg: isToday ? t.todayTint : 'transparent',
      track: future ? t.ringFuture : t.ringPast,
      dash: `${(p * CIRC).toFixed(2)} ${CIRC.toFixed(2)}`,
      arcOpacity: p > 0 ? 1 : 0,
      textColor: isToday ? t.accent : future ? t.dayFuture : t.dayPast,
      weight: isToday ? 700 : 500
    };
  });
  return Array.from({ length: START_OFFSET }, () => blank).concat(days);
}
function chip(c, on, t) {

}
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.theme === 'dark';

    const view = this.props.view ?? 'stats';
    const filter = view === 'stats' ? (this.props.filter ?? 'all') : 'all';
    const confirm = !!this.props.confirmDelete;
    let chips, progressOf, status, archived, rootH;
    if (view === 'archive') {
      const facial = CHALLENGES.find((c) => c.id === 'facial');
      chips = [chip(facial, false, t)];
      progressOf = (n) => (n < TODAY ? 1 : 0);
      status = [{ name: facial.name, color: facial.color, streak: 64 }];
      archived = [{ name: facial.name, color: facial.color, date: 'четвер, 12 листопада' }];
      rootH = '844px';
    } else if (view === 'archiveEmpty') {
      chips = []; progressOf = () => 0; status = []; archived = []; rootH = '844px';
    } else if (filter === 'meditation') {
      chips = CHALLENGES.map((c) => chip(c, c.id === 'meditation', t));
      progressOf = (n) => (MEDITATION_DONE.includes(n) ? 1 : 0);
      status = STATUS_ALL.slice(0, 1); archived = []; rootH = '860px';
    } else {
      chips = CHALLENGES.map((c) => chip(c, false, t));
      progressOf = (n) => DAY_PROGRESS[n - 1];
      status = STATUS_ALL; archived = []; rootH = '960px';
    }
    const allOn = filter === 'all';
    return {
      t, l, rootH,
      isStats: view === 'stats',
      isArchive: view !== 'stats',
      heading: view === 'stats' ? 'Статистика' : 'Архів навичок',
      allPressed: allOn ? 'true' : 'false',
      allBg: allOn ? t.accent : t.surface,
      allBorder: allOn ? t.accent : t.border,
      allColor: allOn ? t.onAccent : t.text2,
      chips,
      days: buildDays(t, progressOf, view === 'stats', l),
      hasStatus: status.length > 0,
      status: status.map((s) => ({ ...s, unit: dayWord(s.streak) })),
      hasArchived: archived.length > 0,
      archived,
      deleteLabel: confirm ? 'Точно?' : 'Видалити',
      deleteColor: confirm ? t.onDanger : t.danger,
      deleteBg: confirm ? t.danger : 'transparent',
      deleteBorder: confirm ? '0' : `1.5px solid ${t.danger}`,
      deletePad: confirm ? '6px 12px' : '5px 12px',
      ...navTabs('stats', t, l)
    };
  }
}
