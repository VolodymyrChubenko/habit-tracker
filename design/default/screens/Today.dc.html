<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Сьогодні</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#7CB9A8}a:hover{color:#5e9c8b}
</style>
</helmet>
<div style="width: 390px; height: {{rootH}}; box-sizing: border-box; background: {{t.bg}}; font-family: Montserrat, -apple-system, sans-serif; color: {{t.text}}; position: relative; overflow: hidden; padding: 16px 16px 24px">
<header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px">
<div style="display: flex; flex-direction: column; gap: 2px">
<h1 style="margin: 0; font-size: 24px; font-weight: 600; color: {{t.text}}">Сьогодні</h1>
<p style="margin: 0; font-size: 13px; color: {{t.text2}}">четвер, 12 листопада</p>
</div>
<a href="{{l.add}}" aria-label="Додати челендж" style="width: 38px; height: 38px; border-radius: 50%; background: {{t.accent}}; color: {{t.onAccent}}; font-size: 22px; font-weight: 400; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px {{t.accentShadow}}; padding-bottom: 4px; box-sizing: border-box; text-decoration: none">+</a>
</header>
<sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}">
<section style="display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; min-height: 506px; padding-bottom: 40px; box-sizing: border-box">
<div style="width: 88px; height: 88px; border-radius: 24px; background: {{t.accentBg}}; display: flex; align-items: center; justify-content: center; font-size: 40px; margin-bottom: 22px">🎯</div>
<h2 style="margin: 0 0 6px; font-size: 18px; font-weight: 600; color: {{t.text}}">Ще немає челенджів</h2>
<p style="margin: 0 0 26px; font-size: 13px; line-height: 1.45; color: {{t.text2}}; max-width: 240px">Створи свій перший челендж і почни відстежувати прогрес</p>
<a href="{{l.add}}" style="display: inline-flex; align-items: center; gap: 8px; background: {{t.accent}}; color: {{t.onAccent}}; font-size: 15px; font-weight: 600; padding: 13px 26px; border-radius: 14px; box-shadow: 0 4px 14px {{t.accentShadow}}; text-decoration: none"><span style="font-size: 19px; line-height: 1">+</span> Додати челендж</a>
</section>
</sc-if>
<sc-if value="{{hasItems}}" hint-placeholder-val="{{true}}">
<div style="margin-bottom: 18px">
<div style="display: flex; justify-content: space-between; font-size: 12px; color: {{t.text2}}; margin-bottom: 5px"><span>Прогрес</span><span>{{doneCount}} / {{total}}</span></div>
<div role="progressbar" aria-label="Прогрес за день" aria-valuemin="0" aria-valuemax="{{total}}" aria-valuenow="{{doneCount}}" style="height: 4px; background: {{t.border}}; border-radius: 4px; overflow: hidden"><div style="width: {{progressPct}}; height: 100%; background: {{t.accent}}; border-radius: 4px"></div></div>
</div>
<sc-if value="{{showBanner}}" hint-placeholder-val="{{true}}">
<aside aria-label="Нагадування" style="background: {{t.accentBg}}; border: 1.5px solid {{t.accent}}; border-radius: 12px; padding: 11px 12px; margin-bottom: 12px; display: flex; align-items: flex-start; gap: 9px">
<span aria-hidden="true" style="font-size: 15px; line-height: 1.2; flex-shrink: 0">🔔</span>
<div style="flex: 1; min-width: 0">
<p style="margin: 0; font-size: 13px; font-weight: 600; color: {{t.text}}">Час виконати</p>
<p style="margin: 3px 0 0; font-size: 13px; line-height: 1.45; color: {{t.text2}}"><a href="#challenge-running" style="font-size: 13px; font-weight: 500; color: {{t.accent}}; border-bottom: 1px dashed {{t.accent}}; text-decoration: none">🏃training</a></p>
</div>
<button type="button" aria-label="Сховати нагадування" style="font-size: 17px; line-height: 1; color: {{t.muted}}; padding: 1px 2px; border: 0; background: none; cursor: pointer; font-family: inherit; flex-shrink: 0">×</button>
</aside>
</sc-if>
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{pending}}" as="it" hint-placeholder-count="7">
<div id="{{it.anchor}}" style="background: {{t.surface}}; border-radius: 12px; box-shadow: {{it.shadow}}; padding: 15px; display: flex; align-items: center; gap: 12px">
<span aria-label="Перетягнути" style="flex-shrink: 0; display: flex; align-items: center; color: {{t.muted}}; padding: 12px 8px; margin: -12px -10px -12px -14px; cursor: grab"><svg width="10" height="16" viewBox="0 0 10 16" fill="currentColor" aria-hidden="true"><circle cx="2" cy="2" r="1.5"></circle><circle cx="8" cy="2" r="1.5"></circle><circle cx="2" cy="8" r="1.5"></circle><circle cx="8" cy="8" r="1.5"></circle><circle cx="2" cy="14" r="1.5"></circle><circle cx="8" cy="14" r="1.5"></circle></svg></span>
<span style="width: 12px; height: 12px; border-radius: 50%; background: {{it.color}}; flex-shrink: 0"></span>
<a href="{{l.edit}}" style="flex: 1; font-size: 16px; font-weight: 500; color: {{t.text}}; text-decoration: none">{{it.name}}</a>
<sc-if value="{{it.reminding}}" hint-placeholder-val="{{false}}"><span role="img" aria-label="нагадування" style="font-size: 13px; line-height: 1; flex-shrink: 0">🔔</span></sc-if>
<button type="button" aria-label="виконати" style="width: 28px; height: 28px; box-sizing: border-box; border-radius: 50%; border: 2px solid {{it.color}}; background: transparent; flex-shrink: 0; padding: 0; cursor: pointer"></button>
</div>
</sc-for>
</div>
<div style="margin-top: 8px">
<button type="button" aria-expanded="{{expandedAttr}}" style="display: flex; align-items: center; gap: 8px; padding: 6px 4px 8px; background: none; border: 0; cursor: pointer; width: 100%; font-family: inherit">
<span style="width: 18px; height: 18px; border-radius: 50%; background: {{t.accent}}; display: flex; align-items: center; justify-content: center; color: {{t.onAccent}}; font-size: 10px; font-weight: 600; flex-shrink: 0">{{doneCount}}</span>
<span style="font-size: 14px; color: {{t.text2}}; font-weight: 500">Виконано</span>
<span style="margin-left: auto; color: {{t.muted}}; font-size: 11px">{{caret}}</span>
</button>
<sc-if value="{{doneExpanded}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{doneItems}}" as="it" hint-placeholder-count="3">
<div style="background: {{t.surface}}; border-radius: 12px; box-shadow: {{t.shadowCard}}; padding: 15px; display: flex; align-items: center; gap: 12px; opacity: 0.65">
<span style="width: 12px; height: 12px; border-radius: 50%; background: {{it.color}}; flex-shrink: 0"></span>
<a href="{{l.edit}}" style="flex: 1; font-size: 16px; font-weight: 500; color: {{t.text2}}; text-decoration: line-through">{{it.name}}</a>
<button type="button" aria-label="скасувати виконання" style="width: 28px; height: 28px; box-sizing: border-box; border-radius: 50%; border: 2px solid {{it.color}}; background: {{it.color}}; flex-shrink: 0; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13l4 4L19 7"></path></svg></button>
</div>
</sc-for>
</div>
</sc-if>
</div>
</sc-if>
<nav aria-label="Навігація" style="position: absolute; left: 12px; right: 12px; bottom: 12px; background: {{t.surface}}; border-radius: 18px; padding: 6px; display: flex; justify-content: space-between; box-shadow: {{t.shadowNav}}">
<sc-for list="{{tabsLeft}}" as="tab" hint-placeholder-count="2">
<a href="{{tab.href}}" aria-current="{{tab.current}}" style="flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 4px; border-radius: 12px; text-decoration: none; background: {{tab.bg}}; color: {{tab.color}}">
<sc-if value="{{tab.isToday}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="3" rx="1.5"></rect><rect x="3" y="11" width="18" height="3" rx="1.5"></rect><rect x="3" y="17" width="18" height="3" rx="1.5"></rect></svg></sc-if>
<sc-if value="{{tab.isStats}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="14" width="4" height="7" rx="1"></rect><rect x="10" y="9" width="4" height="12" rx="1"></rect><rect x="17" y="4" width="4" height="17" rx="1"></rect></svg></sc-if>
<span style="font-size: 10px; font-weight: {{tab.weight}}">{{tab.label}}</span></a>
</sc-for>
<div aria-hidden="true" style="flex: 0 0 58px"></div>
<sc-for list="{{tabsRight}}" as="tab" hint-placeholder-count="2">
<a href="{{tab.href}}" aria-current="{{tab.current}}" style="flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 4px; border-radius: 12px; text-decoration: none; background: {{tab.bg}}; color: {{tab.color}}">
<sc-if value="{{tab.isAch}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg></sc-if>
<sc-if value="{{tab.isSettings}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></sc-if>
<span style="font-size: 10px; font-weight: {{tab.weight}}">{{tab.label}}</span></a>
</sc-for>
<a href="{{l.add}}" aria-label="Додати челендж" style="position: absolute; left: 50%; top: -20px; transform: translateX(-50%); width: 52px; height: 52px; box-sizing: border-box; border-radius: 50%; background: {{t.accent}}; color: {{t.onAccent}}; font-size: 28px; font-weight: 400; display: flex; align-items: center; justify-content: center; border: 4px solid {{t.bg}}; box-shadow: 0 5px 16px {{t.accentShadow}}; padding-bottom: 3px; text-decoration: none">+</a>
</nav>
</div>
</x-dc>

const C = { blue: '#5BA4CF', mint: '#7CB9A8', purple: '#9B89D4', red: '#F06B7E' };
const CHALLENGES = [
  { name: '💻programing', color: C.blue },
  { name: '🔍research session', color: C.blue },
  { name: '💪training', color: C.mint },
  { name: '🏃training', color: C.mint, reminder: true },
  { name: '👁️vision session', color: C.purple },
  { name: '🤦🏻‍♂️facial care', color: C.purple },
  { name: '🚫▶️video [detox]', color: C.red },
  { name: '🧘meditation', color: C.blue, done: true },
  { name: '🚫🎮 gaming [detox]', color: C.red, done: true },
  { name: '🚫🥃alcohol [detox]', color: C.red, done: true }
];
function tokens(props) {
  const p = PALETTES[props.palette] ?? PALETTES.default;
  return p[props.theme === 'dark' ? 'dark' : 'light'];
}
function navTabs(active, t, l) {
  const all = [
    { key: 'today', label: 'Сьогодні', href: l.today, isToday: true },
    { key: 'stats', label: 'Статистика', href: l.stats, isStats: true },
    { key: 'ach', label: 'Досягнення', href: l.ach, isAch: true },
    { key: 'settings', label: 'Налаштування', href: l.settings, isSettings: true }
  ].map((tab) => {
    const on = tab.key === active;
    return { isToday: false, isStats: false, isAch: false, isSettings: false, ...tab, current: on ? 'page' : 'false', bg: on ? t.accentBg : 'transparent', color: on ? t.accent : t.muted, weight: on ? 600 : 500 };
  });
  return { tabsLeft: all.slice(0, 2), tabsRight: all.slice(2) };
}
function links(dark) {
  const s = dark ? 'Dark' : '';
  return { today: `Today${s}.dc.html`, stats: `Statistics${s}.dc.html`, ach: `Achievements${s}.dc.html`, settings: `Settings${s}.dc.html`, add: `NewChallenge${s}.dc.html`, edit: `EditChallenge${s}.dc.html` };
}
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.theme === 'dark';
    const t = tokens(this.props);
    const l = links(dark);
    const isEmpty = !!this.props.empty;
    const showBanner = this.props.reminderActive ?? true;
    const doneExpanded = this.props.doneExpanded ?? true;
    const items = isEmpty ? [] : CHALLENGES;
    const pending = items.filter((c) => !c.done).map((c) => {
      const reminding = !!c.reminder && showBanner;
      // Кільце нагадування — box-shadow, а не border, як у ChallengeItem.module.scss
      return { ...c, reminding, anchor: c.reminder ? 'challenge-running' : undefined, shadow: reminding ? `${t.shadowCard}, 0 0 0 1.5px ${t.accent}` : t.shadowCard };
    });
    const doneItems = items.filter((c) => c.done);
    return {
      t, l, isEmpty, hasItems: !isEmpty, showBanner, doneExpanded,
      rootH: isEmpty ? '844px' : '1000px',
      pending, doneItems,
      doneCount: doneItems.length,
      total: items.length,
      progressPct: items.length ? `${(doneItems.length / items.length) * 100}%` : '0%',
      expandedAttr: doneExpanded ? 'true' : 'false',
      caret: doneExpanded ? '▴' : '▾',
      ...navTabs('today', t, l)
    };
  }
}
